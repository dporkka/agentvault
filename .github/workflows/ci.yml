name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

# Full CI runs once per PR, and once again after merge to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Verify Go modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go test with race detector
        run: go test -race -count=1 ./...
      - name: go build
        run: go build -o /tmp/agentvault ./cmd/agentvault
      - name: Check formatting of changed Go files
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            RANGE="origin/$GITHUB_BASE_REF...HEAD"
          else
            RANGE="HEAD^..HEAD"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$RANGE" -- '*.go' \
              | grep -E '^(core|apps/desktop-wails)/.*\.go$' || true
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Go files to format-check."
            exit 0
          fi

          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "Changed Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentvault-linux-amd64
          path: /tmp/agentvault
          if-no-files-found: error

  frontends:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - web-local
          - browser-extension
          - desktop-wails/frontend
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install shared UI dependencies
        if: matrix.app == 'web-local'
        working-directory: packages/ui
        run: npm ci
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Package browser extension
        if: matrix.app == 'browser-extension'
        working-directory: apps/browser-extension
        run: npm run package
      - name: Upload browser extension artifact
        if: matrix.app == 'browser-extension'
        uses: actions/upload-artifact@v4
        with:
          name: agentvault-browser-extension
          path: apps/browser-extension/agentvault-extension-v*.zip
          if-no-files-found: error

  mobile:
    name: Mobile (Expo type-check and bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile-expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile-expo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Bundle iOS with Metro
        run: npx expo export --platform ios --output-dir dist/ios
      - name: Bundle Android with Metro
        run: npx expo export --platform android --output-dir dist/android
      - name: Upload mobile bundles
        uses: actions/upload-artifact@v4
        with:
          name: agentvault-mobile-bundles
          path: |
            apps/mobile-expo/dist/ios
            apps/mobile-expo/dist/android
          if-no-files-found: error

  desktop:
    name: Desktop (Wails build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop-wails/go.mod
          cache-dependency-path: apps/desktop-wails/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop-wails/frontend/package-lock.json
      - name: Verify Go modules
        working-directory: apps/desktop-wails
        shell: bash
        run: |
          set -euo pipefail
          go mod verify

          cd "$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            RANGE="origin/$GITHUB_BASE_REF...HEAD"
          else
            RANGE="HEAD^..HEAD"
          fi
          MODULE_FILES_CHANGED=$(git diff --name-only "$RANGE" -- apps/desktop-wails/go.mod apps/desktop-wails/go.sum || true)

          cd apps/desktop-wails
          go mod tidy
          if [ -n "$MODULE_FILES_CHANGED" ]; then
            git diff --exit-code go.mod go.sum
          elif ! git diff --quiet -- go.mod go.sum; then
            echo "::warning::apps/desktop-wails Go module metadata has inherited tidy drift; build will use the tidied graph. Touching go.mod/go.sum requires committing tidy output."
          fi
      - name: Install GTK/WebKit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend (required by //go:embed frontend/dist)
        working-directory: apps/desktop-wails/frontend
        run: |
          npm ci
          npm run build
      - name: Run frontend tests
        working-directory: apps/desktop-wails/frontend
        run: npm test
      - name: Build desktop app (Go)
        working-directory: apps/desktop-wails
        run: go build -tags webkit2_41 ./...
      - name: Build desktop Linux binary
        working-directory: apps/desktop-wails
        run: go build -tags webkit2_41 -o /tmp/agentvault-desktop .
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentvault-desktop-linux-amd64
          path: /tmp/agentvault-desktop
          if-no-files-found: error

  contract:
    name: Contract (shared client types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Type-check contract package
        run: |
          cd packages/contract
          npx --yes -p typescript@5.4.5 tsc --noEmit
      - name: Check client contract conventions
        shell: bash
        run: |
          set -euo pipefail
          SNAKE_RE=$(scripts/contract-snake-list.sh core/internal/contract/contract.go | paste -sd'|' -)
          if [ -n "$SNAKE_RE" ]; then
            HITS=$(grep -RInE "$SNAKE_RE" \
              apps/web-local/src \
              apps/browser-extension/src \
              apps/mobile-expo/src \
              apps/desktop-wails/frontend/src \
              --include='*.ts' --include='*.tsx' | head -20 || true)
            if [ -n "$HITS" ]; then
              printf '%s\n' "$HITS"
              echo "Found snake_case keys; server emits camelCase."
              exit 1
            fi
          fi

          if grep -RIn 'http://127.0.0.1:47321' \
            apps/web-local/src \
            apps/browser-extension/src \
            apps/mobile-expo/src \
            apps/desktop-wails/frontend/src \
            --include='*.ts' --include='*.tsx' \
            --exclude='*.test.ts' --exclude='*.test.tsx' \
            | grep -v 'contract/src'; then
            echo "Found hard-coded API base URL; use @agentvault/contract client."
            exit 1
          fi

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - core
      - frontends
      - mobile
      - desktop
      - contract
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs
        shell: bash
        run: |
          results=(
            "${{ needs.core.result }}"
            "${{ needs.frontends.result }}"
            "${{ needs.mobile.result }}"
            "${{ needs.desktop.result }}"
            "${{ needs.contract.result }}"
          )
          printf 'CI results: %s\n' "${results[*]}"
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
