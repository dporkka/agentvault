name: Publish Browser Extension

on:
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: 'Publish to Chrome Web Store (requires secrets)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  publish-extension:
    name: Build and optionally publish browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
      CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
      CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
      CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/browser-extension/package-lock.json
      - name: Install dependencies
        working-directory: apps/browser-extension
        run: npm ci
      - name: Build extension
        working-directory: apps/browser-extension
        run: npm run build
      - name: Package extension
        working-directory: apps/browser-extension
        run: npm run package
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentvault-browser-extension
          path: apps/browser-extension/agentvault-extension-v*.zip
          if-no-files-found: error
      - name: Validate Chrome Web Store credentials
        if: inputs.publish_to_store == true
        shell: bash
        run: |
          set -euo pipefail
          for name in CHROME_WEBSTORE_CLIENT_ID CHROME_WEBSTORE_CLIENT_SECRET CHROME_WEBSTORE_REFRESH_TOKEN CHROME_WEBSTORE_EXTENSION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
      - name: Upload to Chrome Web Store
        if: inputs.publish_to_store == true
        working-directory: apps/browser-extension
        run: |
          npx --yes chrome-webstore-upload upload \
            --source agentvault-extension-v*.zip \
            --extension-id "$CHROME_WEBSTORE_EXTENSION_ID" \
            --client-id "$CHROME_WEBSTORE_CLIENT_ID" \
            --client-secret "$CHROME_WEBSTORE_CLIENT_SECRET" \
            --refresh-token "$CHROME_WEBSTORE_REFRESH_TOKEN"
