name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install GTK/WebKit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        run: |
          (cd apps/web-local && npm ci)
          (cd apps/browser-extension && npm ci)
          (cd apps/desktop-wails/frontend && npm ci)
          (cd apps/mobile-expo && npm ci)
      - name: Build all release artifacts
        run: make release
      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/**
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" \
            --title "AgentVault $TAG" \
            --generate-notes \
            --draft \
            dist/cli/* dist/desktop/* dist/extension/* dist/mobile/*.zip
